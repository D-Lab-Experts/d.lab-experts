<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none" role="img" aria-label="Decisão no Escuro">
  <defs>
    <linearGradient id="dnoG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B18CFF"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
    </linearGradient>
    <linearGradient id="dnoG2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dnoBlur"><feGaussianBlur stdDeviation="36"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0B0B0F"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#B18CFF" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90"  x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Ambient halos -->
  <circle cx="240" cy="220" r="180" fill="#B18CFF" opacity="0.05" filter="url(#dnoBlur)"/>
  <circle cx="580" cy="240" r="160" fill="#4DA3FF" opacity="0.04" filter="url(#dnoBlur)"/>

  <!-- Concentric rings (data clarity) -->
  <circle cx="400" cy="225" r="150" stroke="rgba(234,234,240,0.05)" stroke-width="1" fill="none"/>
  <circle cx="400" cy="225" r="120" stroke="rgba(234,234,240,0.05)" stroke-width="1" fill="none"/>
  <circle cx="400" cy="225" r="90"  stroke="rgba(234,234,240,0.05)" stroke-width="1" fill="none"/>
  <circle cx="400" cy="225" r="60"  stroke="rgba(234,234,240,0.05)" stroke-width="1" fill="none"/>

  <!-- The "gap" arc — incomplete circle = decisions taken without data -->
  <circle cx="400" cy="225" r="120" stroke="url(#dnoG)" stroke-width="2" fill="none"
          stroke-dasharray="540 214" stroke-linecap="round" opacity="0.75"/>

  <!-- Inner accent ring -->
  <circle cx="400" cy="225" r="60" stroke="#B18CFF" stroke-width="1.4" fill="none"
          stroke-dasharray="200 178" stroke-linecap="round" opacity="0.6"/>

  <!-- Core node -->
  <circle cx="400" cy="225" r="6" fill="#B18CFF"/>
  <circle cx="400" cy="225" r="14" fill="#B18CFF" opacity="0.18"/>

  <!-- Network nodes around the core (data points) -->
  <g>
    <circle cx="250" cy="160" r="2.5" fill="#B18CFF" opacity="0.7"/>
    <circle cx="310" cy="300" r="2"   fill="#4DA3FF" opacity="0.6"/>
    <circle cx="520" cy="140" r="2"   fill="#B18CFF" opacity="0.55"/>
    <circle cx="540" cy="310" r="2.5" fill="#4DA3FF" opacity="0.6"/>
    <circle cx="460" cy="350" r="2"   fill="#4DA3FF" opacity="0.5"/>
    <circle cx="340" cy="120" r="2"   fill="#B18CFF" opacity="0.55"/>
    <circle cx="610" cy="200" r="1.6" fill="#4DA3FF" opacity="0.45"/>
    <circle cx="200" cy="260" r="1.6" fill="#B18CFF" opacity="0.45"/>
  </g>

  <!-- Faint connection lines from outer nodes to core -->
  <g stroke-width="0.6" opacity="0.18">
    <line x1="400" y1="225" x2="250" y2="160" stroke="#B18CFF"/>
    <line x1="400" y1="225" x2="540" y2="310" stroke="#4DA3FF"/>
    <line x1="400" y1="225" x2="520" y2="140" stroke="#B18CFF"/>
    <line x1="400" y1="225" x2="310" y2="300" stroke="#4DA3FF"/>
    <line x1="400" y1="225" x2="610" y2="200" stroke="#4DA3FF"/>
  </g>

  <!-- Subtle data axis (lower-left) -->
  <g stroke="#B18CFF" stroke-width="1" opacity="0.18">
    <line x1="60" y1="380" x2="60" y2="320"/>
    <line x1="60" y1="380" x2="180" y2="380"/>
  </g>

  <!-- Subtle stat label -->
  <text x="400" y="408" text-anchor="middle" font-family="Satoshi,system-ui,sans-serif"
        font-size="10" letter-spacing="0.16em" fill="#EAEAF0" opacity="0.30">DECISION INTELLIGENCE</text>
</svg>
