<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="gl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B18CFF"/>
      <stop offset="100%" stop-color="#4DA3FF"/>
    </linearGradient>
    <filter id="sf"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#0B0B0F"/>

  <!-- Subtle grid -->
  <g opacity="0.025" stroke="#B18CFF" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="250" cy="220" r="180" fill="#B18CFF" opacity="0.035" filter="url(#sf)"/>
  <circle cx="580" cy="260" r="140" fill="#FF5C5C" opacity="0.025" filter="url(#sf)"/>

  <!-- Central element: broken/incomplete circle (representing the gap) -->
  <circle cx="400" cy="225" r="120" stroke="rgba(234,234,240,0.04)" stroke-width="1.5" fill="none"/>
  <circle cx="400" cy="225" r="120" stroke="url(#gl)" stroke-width="1.5" fill="none" stroke-dasharray="180 574" stroke-linecap="round" opacity="0.4"/>
  <circle cx="400" cy="225" r="120" stroke="#FF5C5C" stroke-width="1.5" fill="none" stroke-dasharray="340 414" stroke-dashoffset="-180" stroke-linecap="round" opacity="0.2"/>

  <!-- Inner ring -->
  <circle cx="400" cy="225" r="70" stroke="rgba(234,234,240,0.03)" stroke-width="1" fill="none"/>
  <circle cx="400" cy="225" r="70" stroke="#B18CFF" stroke-width="1" fill="none" stroke-dasharray="110 330" stroke-linecap="round" opacity="0.3"/>

  <!-- Core dot -->
  <circle cx="400" cy="225" r="4" fill="#B18CFF" opacity="0.5"/>

  <!-- Scattered nodes (data points, sparse) -->
  <circle cx="260" cy="160" r="2" fill="#B18CFF" opacity="0.3"/>
  <circle cx="310" cy="300" r="1.5" fill="#4DA3FF" opacity="0.25"/>
  <circle cx="520" cy="140" r="1.5" fill="#B18CFF" opacity="0.2"/>
  <circle cx="540" cy="310" r="2" fill="#FF5C5C" opacity="0.2"/>
  <circle cx="460" cy="350" r="1.5" fill="#4DA3FF" opacity="0.2"/>
  <circle cx="340" cy="130" r="1.5" fill="#4DA3FF" opacity="0.15"/>

  <!-- Faint connection lines from nodes to center -->
  <line x1="400" y1="225" x2="260" y2="160" stroke="#B18CFF" stroke-width="0.4" opacity="0.1"/>
  <line x1="400" y1="225" x2="540" y2="310" stroke="#FF5C5C" stroke-width="0.4" opacity="0.08"/>
  <line x1="400" y1="225" x2="520" y2="140" stroke="#B18CFF" stroke-width="0.4" opacity="0.08"/>
  <line x1="400" y1="225" x2="310" y2="300" stroke="#4DA3FF" stroke-width="0.4" opacity="0.08"/>

  <!-- The "74%" stat, subtle -->
  <text x="400" y="218" text-anchor="middle" font-family="Satoshi,system-ui,sans-serif" font-size="36" font-weight="700" fill="#EAEAF0" opacity="0.08">74%</text>
  <text x="400" y="244" text-anchor="middle" font-family="Satoshi,system-ui,sans-serif" font-size="10" fill="#EAEAF0" opacity="0.06" letter-spacing="0.12em">MODO ESCURO</text>
</svg>
